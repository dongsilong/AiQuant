name: LIVE Hardening - Backend

on:
  push:
    branches:
      - hardening/live-production-20261014
  pull_request:
    branches:
      - ai-quant-dev

jobs:
  quant-critical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test critical trade invariants
        run: >-
          bash mvnw -B -ntp
          -pl ruoyi-modules/ruoyi-quant -am
          -Dtest=StrategyEntryGuardServiceTest,StrategyRuntimeLeaseServiceTest,OpenCapacityServiceTest,ExecutionRecoveryServiceTest,BinanceGatewayClockOffsetTest,BinanceSdkContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
