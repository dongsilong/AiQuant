name: LIVE Hardening - Backend

on:
  push:
    branches:
      - hardening/live-production-20261014
  pull_request:
    branches:
      - ai-quant-dev

jobs:
  quant-critical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reject committed plaintext credentials in trading configuration
        run: python3 script/security/check_quant_config_secrets.py
      - name: Test release-evidence integrity gate
        run: python3 -m unittest script/security/test_live_release_evidence.py
      - name: Compile and test critical trade invariants
        run: >-
          bash mvnw -B -ntp
          -pl ruoyi-modules/ruoyi-quant -am
          -Dtest=QuantLiveDefaultsTest,ProtectionOrderServiceTest,UnifiedTradeExecutionServiceTest,UnifiedCancelRecoveryTest,TradingPreparationServiceTest,BinanceSymbolSettingsContractTest,OrderLedgerMonotonicTest,LiveDispatchInspectionControllerTest,LiveOrderDispatcherTest,LiveDispatchLeaseEpochSqlTest,StrategyFillAllocationServiceTest,StrategyPositionAccountingTest,StrategyPositionProjectionContractTest,StrategyFillAuditServiceTest,ExecutionRecoveryValidationTest,RecoveredDispatchRestartTest,RecoveredDispatchSqlTest,StrategyEntryGuardServiceTest,StrategyRuntimeLeaseServiceTest,StrategyCloseOwnershipGuardTest,StrategyCloseOwnershipMapperTest,OpenCapacityServiceTest,RiskSignedPositionCountTest,PaperAtomicMapperTest,ProtectionTargetCoordinatorTest,ExecutionRecoveryServiceTest,TradingReconciliationTransactionTest,ExecutionStatusTransitionTest,LiveDispatchRecoveryGuardSqlTest,LiveRecoveryApprovalSqlContractTest,LiveRecoveryCaseServiceTest,LiveManualRecoveryExecutionServiceTest,LiveRecoveryAuditSecurityTest,LiveSchemaStartupGuardTest,ExchangeIdJsonPrecisionTest,BinanceGatewayClockOffsetTest,BinanceGatewayConnectivityTest,BinanceSdkContractTest,BinanceWebSocketTransportSelectionTest,BinanceTransportPermissionTest,StrategyRuntimeSafetyTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  full-quant-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run all tagged quant development regressions
        run: >-
          bash mvnw -B -ntp
          -pl ruoyi-modules/ruoyi-quant -am
          -Dgroups=dev
          test

  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: only_for_ci
          MYSQL_DATABASE: aiquant_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ponly_for_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      AIQUANT_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/aiquant_ci_test?useSSL=false&allowPublicKeyRetrieval=true
      AIQUANT_MYSQL_USERNAME: root
      AIQUANT_MYSQL_PASSWORD: only_for_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate real InnoDB locks, account capacity and lease ownership
        run: >-
          bash mvnw -B -ntp
          -pl ruoyi-modules/ruoyi-quant -am
          -Dtest=MySqlAtomicConcurrencyTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
