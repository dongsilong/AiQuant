name: Kline Slope Lifecycle Regression

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - hardening/live-production-20261014

permissions:
  contents: read

jobs:
  lifecycle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run KlineSlopeRateStrategy lifecycle regression tests
        run: >-
          bash mvnw -B -ntp
          -pl ruoyi-modules/ruoyi-quant -am
          -Dtest=KlineSlopeRateStrategyTest,StrategyRuntimeSafetyTest,PositionProtectionStateTest,StrategyPositionStateServiceTest,StrategyEntryGuardServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
